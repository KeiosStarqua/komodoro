[workspace]
resolver = "2"
members = [
    "crates/komodoro-core",
    "crates/komodoro-storage",
    "src-tauri",
    "ui",
]
default-members = ["crates/komodoro-core", "crates/komodoro-storage"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KeiosStarqua"]
publish = false

[workspace.dependencies]
komodoro-core = { path = "crates/komodoro-core" }
komodoro-storage = { path = "crates/komodoro-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
